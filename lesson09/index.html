<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/d04e826a4c.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
    <title>Rolodex Card</title>
</head>
<body>
    <div class="rolodex-card">
        <div class="img-info">
            <img src="steve-smith-pm.png" alt="picture of Steve Smith">
            <h1>Steve Smith</h1>
            <h2>Project Manager</h2>
        </div>
        <div class="info-card">
            <p><b>Company:</b> Front End Dev Co</p>
            <p><b>Experience:</b> 3 years</p>
            <p><b>School:</b> UW</p>
            <p><b>Major:</b> Marketing</p>
            <p><b>Email:</b> steve@fedc.com</p>
            <p><i class="fa-brands fa-linkedin-in"></i> steve.linkedinprofile.com</p>
        </div> 
    </div>
</body>
</html>
